name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU-only: no TPU/GPU hardware in CI. torch/jax are optional deps,
      # tested via pytest.importorskip — this just proves the logic.
      - name: Install
        run: pip install -e ".[dev]" numpy torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q
